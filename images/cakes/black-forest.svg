<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_blac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1B18" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="16" fill="#FDFBF9"/>
  <!-- Plate -->
  <ellipse cx="200" cy="250" rx="150" ry="24" fill="#EAE5E0" filter="url(#shadow)"/>
  <ellipse cx="200" cy="246" rx="140" ry="20" fill="#FFFFFF"/>
  <!-- Cake Base Tier -->
  <path d="M 100 230 C 100 250, 300 250, 300 230 L 300 170 C 300 190, 100 190, 100 170 Z" fill="url(#grad_blac)" filter="url(#shadow)"/>
  <ellipse cx="200" cy="170" rx="100" ry="22" fill="#FFFFFF"/>
  <!-- Cake Top Tier -->
  <path d="M 130 170 C 130 185, 270 185, 270 170 L 270 120 C 270 135, 130 135, 130 120 Z" fill="url(#grad_blac)"/>
  <ellipse cx="200" cy="120" rx="70" ry="16" fill="#DC143C"/>
  <!-- Decorative Topping -->
  <circle cx="200" cy="100" r="14" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="180" cy="106" r="10" fill="#DC143C"/>
  <circle cx="220" cy="106" r="10" fill="#DC143C"/>
  <!-- Drip Accents -->
  <path d="M 130 122 Q 140 135, 145 125 Q 160 145, 175 123 Q 190 142, 205 124 Q 220 140, 235 123 Q 250 145, 270 122" fill="none" stroke="#DC143C" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#3D3B40">Black Forest Gateau</text>
</svg>